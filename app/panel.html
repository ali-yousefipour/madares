<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه مدیریت مدارس</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="panelFrame" src="panel-core.html"></iframe><script src="analytics-district-boundaries.js"></script><script>const f=document.getElementById('panelFrame');f.addEventListener('load',()=>{try{const w=f.contentWindow;w.ANALYTICS_REFERENCE_DISTRICT_POLYGONS=window.ANALYTICS_REFERENCE_DISTRICT_POLYGONS;w.analyticsRenderDistrictMap=function(){const host=w.document.getElementById('analyticsDistrictMap');if(!host||typeof w.L==='undefined')return;const all=[...(w.ANALYTICS_CACHE?.by_district||[])].sort((a,b)=>w.analyticsDistrictSortKey(a)-w.analyticsDistrictSortKey(b));const mapObj=w.createMap('analyticsDistrictMap',{lat:36.297,lng:59.606,zoom:11}),map=mapObj.raw;if(!map)return;const palette=['#1769aa','#d69a19','#16826a','#8b4fa3','#b04a38','#287b9d','#5d7f2d','#8a5b2d'];all.forEach((r,i)=>{const id=String(r.district_id||''),ref=w.ANALYTICS_REFERENCE_DISTRICT_POLYGONS[id],color=palette[i%palette.length];if(!ref)return;const selected=id===String(w.ANALYTICS_FILTER_DISTRICT),num=String(r.district_title||'').replace(/ناحیه\s*/,'')||'—',popup='<div><b>ناحیه '+w.esc(num)+'</b><br>مدارس فعال: '+w.analyticsNum(r.school_count)+'<br>دانش‌آموز: '+w.analyticsNum(r.student_count)+'</div>',p=w.L.polygon(ref,{color,weight:selected?4:2,opacity:.95,fillColor:color,fillOpacity:selected?.30:.12});p.bindPopup(popup);p.on('click',()=>w.setAnalyticsDistrict(r.district_id));p.addTo(map);p.bindTooltip('ناحیه '+w.esc(num),{permanent:true,direction:'center',className:'analyticsDistrictLabel'});});});}catch(e){console.error(e)}});</script></body></html>
