name: Generate school sync SQL
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'school-sync-generated') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
      - run: python tools/generate_school_sync.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated_school_sync.sql school_sync_audit.csv school_sync_summary.txt
          git diff --cached --quiet && exit 0
          git commit -m 'school-sync-generated: generate school database sync SQL'
          git push