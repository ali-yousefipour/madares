name: school-sync-analysis-mysql8
on:
  push:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Analyze latest Excel
        run: |
          python - <<'PY'
          import openpyxl, re, json, unicodedata, os
          x='گزارش_تطبیق_دقیق_مدارس_و_شرکتها.xlsx'
          wb=openpyxl.load_workbook(x,data_only=True,read_only=True)
          print("SHEETS",wb.sheetnames)
          for ws in wb.worksheets:
            print("SHEET",ws.title,ws.max_row,ws.max_column)
            for i,r in enumerate(ws.iter_rows(values_only=True)):
              if i>=6: break
              print(i,list(r))
          PY
      - name: Export inspection
        run: |
          python - <<'PY'
          import openpyxl, json
          x='گزارش_تطبیق_دقیق_مدارس_و_شرکتها.xlsx'; wb=openpyxl.load_workbook(x,data_only=True,read_only=True)
          out={}
          for ws in wb.worksheets:
            rows=list(ws.iter_rows(values_only=True))
            out[ws.title]=rows[:30]
          json.dump(out,open('excel-inspect.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: latest-excel-inspect
          path: excel-inspect.json