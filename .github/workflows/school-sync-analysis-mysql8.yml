name: school-sync-analysis-mysql8
on:
  push:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare
        run: pip install openpyxl
      - name: Inspect new data workbook
        run: |
          python - <<'PY'
          import openpyxl,json
          x='new data.xlsx'; wb=openpyxl.load_workbook(x,data_only=True,read_only=True)
          out={}
          for ws in wb.worksheets:
            rows=[]
            for i,r in enumerate(ws.iter_rows(values_only=True)):
              if i>=8: break
              rows.append(list(r))
            out[ws.title]={'max_row':ws.max_row,'max_col':ws.max_column,'rows':rows}
          json.dump(out,open('workbook-inspect.json','w',encoding='utf8'),ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False)[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: school-data-correction
          path: workbook-inspect.json