name: Analyze school reconciliation data
permissions:
  contents: write
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install openpyxl
      - name: Analyze
        run: |
          python - <<'PY'
          import json,re,glob,openpyxl,os
          out={}
          xf='گزارش_تطبیق_دقیق_مدارس_و_شرکتها.xlsx'
          wb=openpyxl.load_workbook(xf,data_only=True,read_only=True)
          out['excel']={}
          for ws in wb.worksheets:
            it=ws.iter_rows(values_only=True); first=next(it,None); rows=[list(r) for r in it if any(v not in (None,'') for v in r)]
            out['excel'][ws.title]={'headers':list(first or []),'rows':len(rows),'all_rows':rows}
          sf='h301194_school.sql'; s=open(sf,encoding='utf-8',errors='replace').read()
          creates=[]
          for m in re.finditer(r'CREATE TABLE(?: IF NOT EXISTS)?\s+[`]?([^\s`(]+)[`]?[\s]*\((.*?)\)\s*ENGINE=',s,re.I|re.S):
            creates.append({'table':m.group(1),'definition':m.group(2)[:20000]})
          inserts={}
          for m in re.finditer(r'INSERT INTO\s+[`]?([^\s`(]+)[`]?',s,re.I): inserts[m.group(1)]=inserts.get(m.group(1),0)+1
          def extract_inserts(table):
            tick=chr(96); pat=r'INSERT INTO\s+'+tick+'?'+re.escape(table)+tick+'?'+r'\s*\((.*?)\)\s*VALUES\s*(.*?);'
            return re.finditer(pat,s,re.I|re.S)
          def split_rows(v):
            rows=[]; buf=[]; q=False; esc=False; depth=0; i=0; active=False
            while i<len(v):
              ch=v[i]
              if q:
                if active: buf.append(ch)
                if esc: esc=False
                elif ch=='\\\\': esc=True
                elif ch==chr(39): q=False
              else:
                if ch==chr(39): q=True; active=True; buf.append(ch)
                elif ch=='(' and depth==0: depth=1; active=True; buf=[ch]
                elif ch=='(' and depth>0: depth+=1; buf.append(ch)
                elif ch==')' and depth>0:
                  depth-=1; buf.append(ch)
                  if depth==0: rows.append(''.join(buf)); buf=[]; active=False
                elif active: buf.append(ch)
              i+=1
            return rows
          def parse_tuple(t):
            inner=t[1:-1]; vals=[]; buf=[]; q=False; esc=False; i=0
            while i<len(inner):
              ch=inner[i]
              if q:
                buf.append(ch)
                if esc: esc=False
                elif ch=='\\\\': esc=True
                elif ch==chr(39): q=False
              else:
                if ch==chr(39): q=True; buf.append(ch)
                elif ch==',': vals.append(''.join(buf).strip()); buf=[]
                else: buf.append(ch)
              i+=1
            vals.append(''.join(buf).strip())
            out=[]
            for v in vals:
              if v.upper()=='NULL': out.append(None)
              elif len(v)>=2 and v[0]==chr(39) and v[-1]==chr(39): out.append(v[1:-1].replace(chr(39)+chr(39),chr(39)))
              else: out.append(v)
            return out
          parsed={}
          for table in ['districts','companies','schools']:
            ms=list(extract_inserts(table))
            if not ms: parsed[table]=[]; continue
            cols=[x.strip().strip(chr(96)) for x in ms[0].group(1).split(',')]
            parsed[table]=[dict(zip(cols,parse_tuple(r))) for m in ms for r in split_rows(m.group(2))]
          out['parsed_data']={k:{'count':len(v),'columns':list(v[0].keys()) if v else [],'rows':v} for k,v in parsed.items()}
          out['sql']={'file':sf,'bytes':len(s.encode()),'tables':creates,'insert_statements':inserts,'school_related_tables':[x['table'] for x in creates if re.search(r'school|madres|student',x['table'],re.I)],'head':s[:5000],'tail':s[-5000:],'keywords':{k:len(re.findall(k,s,re.I)) for k in ['CREATE','INSERT','UPDATE','VALUES','school','student','district','students']}}
          out['sql']['schools_definition']=next((x['definition'] for x in creates if x['table']=='schools'),'')
          from difflib import SequenceMatcher
          import unicodedata,hashlib
          def norm(v):
            if v is None: return ''
            s=str(v).strip().lower()
            for a,b in {'ي':'ی','ى':'ی','ك':'ک','ۀ':'ه','ة':'ه','ؤ':'و','إ':'ا','أ':'ا','ٱ':'ا'}.items(): s=s.replace(a,b)
            s=unicodedata.normalize('NFKC',s)
            s=''.join(ch for ch in s if not unicodedata.category(ch).startswith('P') and not ch.isspace())
            return s
          def sim(a,b): return SequenceMatcher(None,norm(a),norm(b)).ratio()
          district_by_title={norm(r['title']):int(r['id']) for r in parsed['districts'] if r.get('is_active')=='1'}
          district_title_by_id={int(r['id']):r['title'] for r in parsed['districts']}
          company_by_id={int(r['id']):r for r in parsed['companies'] if r.get('id') and str(r['id']).isdigit()}
          company_exact={norm(r.get('title')):int(r['id']) for r in company_by_id.values() if r.get('title')}
          def company_match(name):
            if not name: return (None,0,'none')
            n=norm(name)
            if n in company_exact: return (company_exact[n],1,'exact')
            best=(None,0,'none')
            for r in company_by_id.values():
              sc=sim(name,r.get('title'))
              if sc>best[1]: best=(int(r['id']),sc,'fuzzy')
            return best
          excel_rows=out['excel']['همه_مدارس_Excel']['all_rows']
          db_rows=parsed['schools']
          db_by_id={int(r['id']):r for r in db_rows if r.get('id') and str(r['id']).isdigit()}
          def level_score(a,b):
            if not a or not b: return 0.35
            na,nb=norm(a),norm(b)
            if na==nb: return 1.0
            groups=[('دبستان','ابتدایی','دبستاندورهاول','ابتداییدورهاول','ابتداییدورهدوم','ابتداییدورهاولودوم'),('دبیرستان','دبیرستان1','دبیرستان2','دبیرستاندورهاول','دبیرستاندورهدوم','متوسطهدورهاول','متوسطهدورهدوم','دبیرستادورهاول'),('هنرستان',),('پیشدبستانی',),('مهد',)]
            for g in groups:
              if na in [norm(x) for x in g] and nb in [norm(x) for x in g]: return 0.85
            return sim(a,b)
          company_cache={}
          for r in out['excel']['شرکتها']['all_rows']:
            cid,cs,cm=company_match(r[0]); company_cache[norm(r[0])]={'id':cid,'score':cs,'method':cm}
          matched={}; used=set(); ambiguous=[]
          for i,r in enumerate(excel_rows):
            excel_name=r[3]; excel_level=r[4]; excel_dist=r[2]; excel_company=r[6]; excel_dist_id=district_by_title.get(norm(excel_dist))
            hint=r[9] if len(r)>9 else None
            if hint is not None and int(hint) in db_by_id and r[7]=='انجام شد':
              d=db_by_id[int(hint)]; matched[i]={'db_id':int(hint),'score':1.0,'method':'previous_report_db_id','name_score':sim(excel_name,d.get('name')),'level_score':level_score(excel_level,d.get('level')),'company_score':sim(excel_company,company_by_id.get(int(d['company_id']),{}).get('title')) if d.get('company_id') and str(d.get('company_id')).isdigit() else 0,'district_ok':str(d.get('district_id'))==str(excel_dist_id)}; used.add(int(hint)); continue
            exact=[d for d in db_rows if d.get('id') and str(d['id']).isdigit() and int(d['id']) not in used and norm(d.get('name'))==norm(excel_name) and excel_dist_id is not None and d.get('district_id') and str(d.get('district_id'))==str(excel_dist_id)]
            if len(exact)==1:
              d=exact[0]; matched[i]={'db_id':int(d['id']),'score':1.0,'method':'exact_name_district','name_score':1.0,'level_score':level_score(excel_level,d.get('level')),'company_score':0,'district_ok':True}; used.add(int(d['id'])); continue
              d=db_by_id[int(hint)]; matched[i]={'db_id':int(hint),'score':1.0,'method':'previous_report_db_id','name_score':sim(excel_name,d.get('name')),'level_score':level_score(excel_level,d.get('level')),'company_score':sim(excel_company,company_by_id.get(int(d['company_id']),{}).get('title')) if d.get('company_id') and str(d.get('company_id')).isdigit() else 0,'district_ok':str(d.get('district_id'))==str(excel_dist_id)}; used.add(int(hint)); continue
            candidates=[]
            for d in db_rows:
              if not d.get('id') or not str(d['id']).isdigit() or int(d['id']) in used: continue
              did=int(d['id']); ddid=int(d['district_id']) if d.get('district_id') and str(d.get('district_id')).isdigit() else None
              district_ok=(excel_dist_id is not None and ddid==excel_dist_id)
              ns=sim(excel_name,d.get('name')); ls=level_score(excel_level,d.get('level'))
              if district_ok: base=ns*0.68+ls*0.20
              else: base=ns*0.55+ls*0.15
              cm=company_cache.get(norm(excel_company),{'id':None,'score':0}) if excel_company else {'id':None,'score':0}
              comp=1 if cm.get('id') and d.get('company_id') and str(d.get('company_id')).isdigit() and int(d['company_id'])==cm['id'] else 0
              student=abs(int(d.get('student_count') or 0)-int(r[5] or 0)); student_score=1/(1+student/100)
              score=base+0.10*comp+0.05*student_score+(0.12 if district_ok else 0)
              candidates.append((score,ns,ls,comp,student,d))
            candidates.sort(key=lambda z:z[0],reverse=True)
            if candidates:
              best=candidates[0]; second=candidates[1][0] if len(candidates)>1 else 0
              if (best[1]>=0.94 and best[2]>=0.5 and (best[0]-second>=0.015 or best[1]>=0.98)) or (best[1]>=0.985 and best[2]>=0.35):
                d=best[5]; did=int(d['id']); matched[i]={'db_id':did,'score':round(best[0],4),'method':'fuzzy_name_district_level','name_score':round(best[1],4),'level_score':round(best[2],4),'company_score':best[3],'district_ok':str(d.get('district_id'))==str(excel_dist_id)}; used.add(did)
              else: ambiguous.append({'excel_index':i,'name':excel_name,'district':excel_dist,'level':excel_level,'company':excel_company,'best_score':round(best[0],4),'name_score':round(best[1],4),'candidates':[{'id':int(z[5]['id']),'name':z[5].get('name'),'district':district_title_by_id.get(int(z[5]['district_id'])) if z[5].get('district_id') and str(z[5].get('district_id')).isdigit() else None,'level':z[5].get('level'),'score':round(z[0],4)} for z in candidates[:5]]})
          new_rows=[{'excel_index':i,'row':r} for i,r in enumerate(excel_rows) if i not in matched]
          inactive=[int(r['id']) for r in db_rows if r.get('id') and str(r['id']).isdigit() and int(r['id']) not in used]
          out['reconciliation']={'excel_count':len(excel_rows),'matched_count':len(matched),'new_count':len(new_rows),'ambiguous_count':len(ambiguous),'db_count':len(db_rows),'deactivate_count':len(inactive),'excel_students':sum(int(r[5] or 0) for r in excel_rows),'matched_db_ids':sorted(used),'new_rows':new_rows,'ambiguous':ambiguous,'inactive_db_ids':inactive,'company_matches':company_cache,'districts':district_title_by_id}
          os.makedirs('analysis',exist_ok=True)
          raw_students=[float(r[5] or 0) for r in excel_rows]
          target_students=int(round(sum(raw_students)))
          floors=[int(v) for v in raw_students]
          add=target_students-sum(floors)
          order=sorted(range(len(raw_students)),key=lambda i:(raw_students[i]-floors[i]),reverse=True)
          stored_students=floors[:]
          for j in order[:max(0,add)]: stored_students[j]+=1
          def sqlq(v):
            if v is None: return 'NULL'
            if isinstance(v,bool): return '1' if v else '0'
            if isinstance(v,(int,float)): return str(v)
            return chr(39)+str(v).replace(chr(39),chr(39)*2)+chr(39)
          existing_codes={str(r.get('code')) for r in db_rows if r.get('code')}
          new_codes={}
          def make_code(i,r):
            base=1000000000+(int(hashlib.sha256((str(r[3])+'|'+str(r[2])+'|'+str(r[4])+'|'+str(i)).encode('utf-8')).hexdigest()[:12],16)%9000000000)
            code=str(base)
            while code in existing_codes or code in new_codes.values(): base=1000000000+((int(base)-1000000000+1)%9000000000); code=str(base)
            new_codes[i]=code; return code
          lines=['-- Excel is authoritative for the school master data.','-- Generated from h301194_school.sql and گزارش_تطبیق_دقیق_مدارس_و_شرکتها.xlsx','START TRANSACTION;','UPDATE schools SET is_active=0;']
          for i,m in sorted(matched.items()):
            r=excel_rows[i]; d=db_by_id[m['db_id']]; cm=company_cache.get(norm(r[6]),{'id':None}) if r[6] else {'id':None}
            cid=cm.get('id')
            lines.append('UPDATE schools SET name='+sqlq(r[3])+', district_id='+sqlq(excel_dist_id if (excel_dist_id:=district_by_title.get(norm(r[2]))) is not None else None)+', company_id='+sqlq(cid)+', level='+sqlq(r[4])+', student_count='+str(stored_students[i])+', is_active=1 WHERE id='+str(m['db_id'])+';')
          for nrow in new_rows:
            i=nrow['excel_index']; r=nrow['row']; did=district_by_title.get(norm(r[2])); cm=company_cache.get(norm(r[6]),{'id':None}) if r[6] else {'id':None}; code=make_code(i,r)
            lines.append('INSERT INTO schools (code,name,district_id,company_id,level,student_count,is_active) VALUES ('+','.join([sqlq(code),sqlq(r[3]),sqlq(did),sqlq(cm.get('id')),sqlq(r[4]),str(stored_students[i]),'1'])+');')
          lines += ['','-- Verification: active school count and student total must match the Excel row count and rounded integer student total.','SELECT COUNT(*) AS active_school_count, COALESCE(SUM(student_count),0) AS active_student_total FROM schools WHERE is_active=1;','COMMIT;']
          open('analysis/school_reconciliation.sql','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          out['reconciliation']['raw_excel_students']=sum(raw_students)
          out['reconciliation']['stored_integer_students']=sum(stored_students)
          out['reconciliation']['fractional_excel_rows']=sum(abs(v-round(v))>1e-9 for v in raw_students)
          out['reconciliation']['sql_file']='school_reconciliation.sql'
          special=[r for r in db_rows if r.get('district_id')=='11']
          md=['# گزارش نهایی تطبیق مدارس','',f'- ردیف‌های Excel: {len(excel_rows)}',f'- مدارس تطبیق‌یافته با DB: {len(matched)}',f'- مدارس جدید قابل ثبت: {len(new_rows)}',f'- مدارس DB برای غیرفعال‌سازی: {len(inactive)}',f'- مدارس DB با ناحیه «خاص» که در Excel پیدا نشدند و در نتیجه غیرفعال می‌شوند: {len(special)}',f'- مجموع خام دانش‌آموز Excel: {sum(raw_students):.2f}',f'- مجموع صحیح قابل ذخیره در ستون INT: {sum(stored_students)}',f'- ردیف‌های دارای مقدار اعشاری دانش‌آموز: {sum(abs(v-round(v))>1e-9 for v in raw_students)}','', '## مدارس با ناحیه خاص که در Excel یافت نشدند','']
          for d in special: md.append(f"- ID {d['id']} — {d.get('name')} — مقطع: {d.get('level') or '-'}")
          md += ['', '## مدارس جدید','']
          for nrow in new_rows: md.append(f"- {nrow['row'][3]} | {nrow['row'][2]} | {nrow['row'][4] or '-'} | {nrow['row'][6] or '-'} | دانش‌آموز ذخیره‌شده: {stored_students[nrow['excel_index']]}")
          open('analysis/school_reconciliation_report.md','w',encoding='utf-8').write('\n'.join(md)+'\n')
          os.makedirs('analysis',exist_ok=True)
          json.dump(out,open('analysis/reconciliation.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open('analysis/summary.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit generated reconciliation files
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/school_reconciliation.sql analysis/school_reconciliation_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate school reconciliation SQL [skip ci]"
            git fetch origin ${{ github.head_ref }}
            git reset --soft origin/${{ github.head_ref }}
            git commit -m "Generate school reconciliation SQL [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-analysis
          path: analysis
